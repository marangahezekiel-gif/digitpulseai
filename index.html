function rfc(c,w){var q=c.q.slice(-(w+1)),u=0,f=0;for(var i=1;i<q.length;i++){if(q[i]>q[i-1])u++;else if(q[i]<q[i-1])f++}return[u,f]}

if(t==="md")return DX.md==="matches"?k.indexOf(Math.max.apply(null,k)):k.indexOf(Math.min.apply(null,k));
if(t==="rf"){var r=rfc(c,w);return r[0]>=r[1]?"RISE":"FALL"}
if(t==="eo"){var e=k[0]+k[2]+k[4]+k[6]+k[8];return e>=n-e?"EVEN":"ODD"}

function pctA(c,t,x,w){var a=cnt(c,w),k=a.c,n=a.n;
if(t==="md")return DX.md==="matches"?k[x]/n*100:100-k[x]/n*100;
if(t==="rf"){var r=rfc(c,w),m=r[0]+r[1]||1;return(x==="RISE"?r[0]:r[1])/m*100}
if(t==="eo"){var e=k[0]+k[2]+k[4]+k[6]+k[8];return(x==="EVEN"?e:n-e)/n*100}
var o=0;for(var i=0;i<10;i++){if(DX.os==="over"?i>DX.ob:i<DX.ob)o+=k[i]}return o/n*100}
/* Confidence: how far the recent pattern is from normal. 0 = as expected, 100 = as strong as it gets. It is not a win probability. */
function evalCard(c){var t=DX.tab,v={},best=null,bc=0,p=0,e,D,k;if(c.d.length<20)return null;
WIN.forEach(function(w){var x=pickA(c,t,w);v[x]=(v[x]||0)+1});
for(k in v){if(v[k]>bc){bc=v[k];best=k}}
if(t==="md"||t==="ou")best=String(best);
WIN.forEach(function(w){p+=pctA(c,t,t==="md"?+best:best,w)});p/=WIN.length;
e=expd(t);D=t==="md"?10:(t==="ou"?Math.min(25,100-e):25);

function waitish(){return S.status==="pending"||S.status==="rejected"||S.status==="revoked"||S.status==="expired"}
function route(){var v=S.view;if(S.status==="approved"){if(v==="wait"||v==="pay"||v==="plans"||v==="login")return go("dash")}else if(v==="dash"&&!PREVIEW){return go(waitish()?"wait":"plans")}if(v==="wait")render()}
function sync(){if(!S.cid||!S.account)return Promise.resolve();return jfetch("/api/status?id="+S.cid,{cache:"no-store"}).then(function(x){if(!x.ok)return;var st=x.j.status,ch=false;
if(st==="approved"){if(S.status!=="approved"||S.plan!==x.j.plan){S.status="approved";S.plan=x.j.plan;S.stk=false;ch=true}}
else if(st==="pending"){if(S.status!=="pending"){S.status="pending";ch=true}if(!S.plan&&x.j.plan)S.plan=x.j.plan;if(!S.reg)register()}
else if(st==="rejected"||st==="revoked"||st==="expired"){if(S.status!==st){S.status=st;ch=true}}
else if(st==="none"){if(S.status==="pending"&&!S.reg){register()}else if(S.status==="pending"||S.status==="approved"){S.status=null;S.reg=false;ch=true}}
if(ch){save();route()}}).catch(function(){})}
function initWait(){clearInterval(wt);if(S.view==="wait"&&S.status==="pending")wt=setInterval(sync,S.stk?5000:20000);else if(S.view==="dash"&&!PREVIEW&&S.status==="approved")wt=setInterval(sync,60000)}
function checkNow(b){b.disabled=true;b.textContent="Checking...";sync().then(function(){if(S.view==="wait")render()})}
function waitView(){var p=plan(),st=S.status,wa='<a href="'+waLink()+'" target="_blank" rel="noopener"><button class="btn">Open WhatsApp</button></a>',pv='',t,msg,acts;
if(st==="rejected"){t="Payment not verified";msg="We could not verify your payment. Please check that you paid the right amount and sent your screenshot on WhatsApp, or choose a plan and try again.";acts=wa+'<button class="btn g" onclick="reset()">Choose a plan</button>'}
else if(st==="revoked"){t="Access removed";msg="Your access was removed. Please contact us on WhatsApp if you think this is a mistake.";acts=wa}
else if(st==="expired"){t="Access ended";msg="Your yearly access has ended. Choose a plan to renew.";acts='<button class="btn" onclick="reset()">Choose a plan</button>'}
else if(S.stk){t="Check your phone";msg='We sent an M-Pesa prompt for <b style="color:var(--tx)">'+(p?p.name:'')+'</b>'+(S.stkAmt?' (KES '+S.stkAmt+')':'')+'. Enter your M-Pesa PIN to pay. This page unlocks by itself as soon as the payment is confirmed &mdash; no screenshot needed.';acts='<button class="btn" onclick="checkNow(this)">Check status</button><button class="btn g" onclick="go(\'pay\')">Send prompt again</button>'+wa}
else{t="Waiting for approval";msg='We received your payment request for <b style="color:var(--tx)">'+(p?p.name:'')+'</b>. Once you send your screenshot on WhatsApp, we approve your access. You do not need to pay again &mdash; just return to this page.';acts=wa+'<button class="btn g" onclick="checkNow(this)">Check status</button>'}
var note=(st==="pending"&&S.regErr&&!PREVIEW)?'<p class="note">We could not register your request automatically. Please make sure your screenshot reaches us on WhatsApp and we will approve you manually. <a href="#" onclick="register();return false" style="color:var(--wr)">Try again</a></p>':((st==="pending"&&S.reg)?'<p class="note" style="color:var(--ac)">Request registered. This page updates by itself once you are approved.</p>':'');
return '<div class="card wait" style="max-width:480px;margin:0 auto"><div class="ic">'+(st==="pending"||!st?'&#9203;':'&#9888;&#65039;')+'</div><h2>'+t+'</h2><p>'+msg+'</p>'+note+'<div class="acts" style="justify-content:center">'+acts+pv+'</div>'+keyLnk('wait','Proceed using a key','center')+'</div>'}
function render(){
if(S.view==="dash"&&!PREVIEW&&S.status!=="approved")S.view=waitish()?"wait":(S.account?"plans":"home");
document.getElementById("app").innerHTML=V[S.view]();initHome();initWait();document.body.classList.toggle("dxon",S.view==="dash");if(S.view==="dash")dxMount();else dxStop();applyLang();fxPaint()}
load();ensureCid();parseOAuth();
if(S.account&&(S.status==="pending"||S.status==="rejected"||S.status==="revoked"||S.status==="expired"))S.view="wait";else if(S.status==="approved"&&S.account)S.view="dash";
try{var rv=sessionStorage.getItem("dpai_rv");sessionStorage.removeItem("dpai_rv");if(rv&&V[rv]&&rv!=="dash"&&!(rv==="pay"&&!plan())&&!(S.status==="approved"&&/^(wait|pay|plans|login)$/.test(rv)))S.view=rv}catch(e){}
fxLoad();fxFill();render();ibShow();stkProbe();promoRefresh();setInterval(promoRefresh,3e5);sync();gtLoad();fxFetch();setInterval(function(){fxFetch()},36e5);
</script>
