<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigitpulseAi</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--bd:#263056;--tx:#e8ecff;--mu:#9aa6d6;--ac:#22d3a6;--ac2:#6366f1;--wr:#fbbf24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6ff;--card:#fff;--bd:#d9def5;--tx:#141b34;--mu:#5b6591;--ac:#0d9f7e;--ac2:#4f46e5;--wr:#b45309}}
:root[data-theme="light"]{--bg:#f4f6ff;--card:#fff;--bd:#d9def5;--tx:#141b34;--mu:#5b6591;--ac:#0d9f7e;--ac2:#4f46e5;--wr:#b45309}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b34;--bd:#263056;--tx:#e8ecff;--mu:#9aa6d6;--ac:#22d3a6;--ac2:#6366f1;--wr:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:960px;margin:0 auto;padding:20px 16px 48px}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-weight:800;font-size:1.25rem}.logo b{color:var(--ac)}
.pill{font-size:.8rem;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:4px 10px}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.15;margin:.2em 0}
h2{margin:.2em 0 .6em}
p{color:var(--mu)}
.btn{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;font-weight:700;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan{cursor:pointer;position:relative;transition:.15s}
.plan:hover,.plan.sel{border-color:var(--ac);transform:translateY(-2px)}
.price{font-size:2rem;font-weight:800}.price small{font-size:.9rem;color:var(--mu);font-weight:400}
.tag{position:absolute;top:-10px;right:14px;background:var(--ac);color:#04221b;font-size:.7rem;font-weight:800;padding:2px 10px;border-radius:99px}
ul{padding-left:18px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0 14px}
.row code{flex:1;word-break:break-all;font-size:.9rem}
.row button{border:0;background:var(--ac2);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs .btn{flex:1}
.hid{display:none}
.steps{display:flex;gap:6px;margin-bottom:18px;font-size:.75rem;color:var(--mu);flex-wrap:wrap}
.steps span{padding:3px 10px;border-radius:99px;border:1px solid var(--bd)}.steps .on{background:var(--ac);color:#04221b;border-color:var(--ac);font-weight:700}
.wait{text-align:center}.wait .ic{font-size:3rem}
.note{font-size:.8rem;color:var(--wr)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="w">
<nav><div class="logo">Digitpulse<b>Ai</b></div></nav>
<div class="steps" id="steps"></div>
<main id="app"></main>
</div>
<script>
var APP_ID="34yJS0kUHIBFwADximqJH",WA="254741092009",USDT="TFqjtFXBmu6aeFMar3VZzijJqRcNYzXndB",MPESA="0741080064",PAYEE="Hezekiel Machuka";
var PLANS=[
{id:"matches",name:"Matches / Differs",price:150,tag:"Best value",f:["All market analysis","Matches / Differs signals","Rise/Fall, Even/Odd, Over/Under","Full year access"]},
{id:"rfeo",name:"Rise/Fall + Even/Odd",price:100,f:["All other markets","Rise/Fall analysis","Even/Odd analysis","No Matches / Differs"]},
{id:"ou",name:"Over / Under",price:80,f:["Over/Under analysis","Digit stats and trends","Full year access"]}];
var S={view:"home",account:null,plan:null,method:"usdt",status:null};
function load(){try{var d=JSON.parse(localStorage.getItem("dpai")||"{}");for(var k in d)S[k]=d[k]}catch(e){}}
function save(){try{localStorage.setItem("dpai",JSON.stringify({account:S.account,plan:S.plan,status:S.status}))}catch(e){}}
function plan(){return PLANS.filter(function(p){return p.id===S.plan})[0]}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function copy(t,b){var ok=function(){var o=b.textContent;b.textContent="Copied!";setTimeout(function(){b.textContent=o},1400)};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}}
function parseOAuth(){var q=new URLSearchParams(location.search),a=q.get("acct1");
if(a){S.account=a;save();try{history.replaceState(null,"",location.pathname)}catch(e){}}}
function derivLogin(){location.href="https://oauth.deriv.com/oauth2/authorize?app_id="+APP_ID}
function demo(){S.account="Demo-User";save();go(S.plan?"pay":"plans")}
function pick(id){S.plan=id;save();if(S.status==="pending")go("wait");else if(!S.account)go("login");else go("pay")}
function waLink(){var p=plan();return "https://wa.me/"+WA+"?text="+encodeURIComponent("Hello, I have paid for DigitpulseAi ("+p.name+" - $"+p.price+"/yr) via "+(S.method==="usdt"?"USDT TRC20":"M-Pesa")+". Account: "+S.account+". Screenshot attached.")}
function paid(){S.status="pending";save();window.open(waLink(),"_blank");go("wait")}
function reset(){S.plan=null;S.status=null;S.method="usdt";save();go("plans")}
function logout(){S={view:"home",account:null,plan:null,status:null,method:"usdt"};save();render()}
function setM(m){S.method=m;render()}
function accessTool(){if(!S.account)go("login");else if(S.status==="pending")go("wait");else go("plans")}
function row(v,id){return '<div class="row"><code>'+v+'</code><button onclick="copy(\''+v+'\',this)">Copy</button></div>'}
var V={
home:function(){return '<div class="card" style="padding:36px 22px"><span class="pill">Deriv digit analysis</span><h1>Read the digits.<br>Trade with <span style="color:var(--ac)">clarity</span>.</h1><p>DigitpulseAi analyses Deriv markets and surfaces Matches/Differs, Rise/Fall, Even/Odd and Over/Under signals in real time.</p><div class="acts"><button class="btn" onclick="accessTool()">Access Tool</button><button class="btn g" onclick="go(\'plans\')">View Pricing</button>'+(S.account?'<button class="btn g" onclick="logout()">Disconnect</button>':'')+'</div></div><div class="grid" style="margin-top:14px"><div class="card"><b>Live digit stats</b><p>Frequency and streaks per market.</p></div><div class="card"><b>All markets</b><p>Pick a plan, unlock the markets you need.</p></div><div class="card"><b>Secure Deriv login</b><p>Connect with official Deriv OAuth.</p></div></div>'},
login:function(){return '<div class="card" style="max-width:440px;margin:0 auto"><h2>Connect your Deriv account</h2><p>Log in with Deriv to link your account, then continue to billing.</p><button class="btn" style="width:100%" onclick="derivLogin()">Connect with Deriv</button><div class="acts"><button class="btn g" onclick="demo()">Continue in preview mode</button><button class="btn g" onclick="go(\'home\')">Back</button></div><p class="note">Preview mode skips Deriv login so you can test the billing flow.</p></div>'},
plans:function(){return '<h2>Choose your plan</h2><p>Billed yearly. Select an offer to continue.</p><div class="grid">'+PLANS.map(function(p){return '<div class="card plan" style="display:flex;flex-direction:column">'+(p.tag?'<span class="tag">'+p.tag+'</span>':'')+'<b>'+p.name+'</b><div class="price">$'+p.price+'<small>/yr</small></div><ul style="flex:1">'+p.f.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><button class="btn" style="width:100%" onclick="pick(\''+p.id+'\')">Choose plan</button></div>'}).join('')+'</div><div class="acts"><button class="btn g" onclick="go(\'home\')">Back</button></div>'},
pay:function(){var p=plan(),u=S.method==="usdt";return '<div class="card" style="max-width:520px;margin:0 auto"><h2>Payment</h2><p>'+p.name+' &middot; <b style="color:var(--tx)">$'+p.price+'/yr</b></p><div class="tabs"><button class="btn'+(u?'':' g')+'" onclick="setM(\'usdt\')">USDT TRC20</button><button class="btn'+(u?' g':'')+'" onclick="setM(\'mpesa\')">M-Pesa</button></div>'+(u?'<p>Send exactly <b style="color:var(--tx)">'+p.price+' USDT</b> on the <b style="color:var(--tx)">TRC20</b> network to:</p>'+row(USDT)+'<p class="note">Only use the TRC20 network. Other networks will be lost.</p>':'<p>Send <b style="color:var(--tx)">KES equivalent of $'+p.price+'</b> to:</p>'+row(MPESA)+'<p>Name: <b style="color:var(--tx)">'+PAYEE+'</b></p>')+'<p>After paying, tap below and send your payment screenshot on WhatsApp.</p><div class="acts"><button class="btn" onclick="paid()">I have made the payment</button><button class="btn g" onclick="go(\'plans\')">Back</button></div></div>'},
wait:function(){var p=plan();return '<div class="card wait" style="max-width:480px;margin:0 auto"><div class="ic">&#9203;</div><h2>Waiting for approval</h2><p>We received your payment request for <b style="color:var(--tx)">'+(p?p.name:'')+'</b>. Once you send your screenshot on WhatsApp, it will be approved shortly. You do not need to pay again &mdash; just return to this page.</p><div class="acts" style="justify-content:center"><a href="'+waLink()+'" target="_blank" rel="noopener"><button class="btn">Open WhatsApp</button></a><button class="btn g" onclick="reset()">Reset (preview)</button></div></div>'}
};
var ST=[["home","Welcome"],["login","Connect"],["plans","Plan"],["pay","Pay"],["wait","Approval"]];
function render(){
document.getElementById("steps").innerHTML=ST.map(function(s){return '<span class="'+(s[0]===S.view?'on':'')+'">'+s[1]+'</span>'}).join('');
document.getElementById("app").innerHTML=V[S.view]()}
load();parseOAuth();
if(S.status==="pending"&&S.account)S.view="wait";else if(S.account&&S.plan)S.view="pay";
render();
</script>
</body>
</html>
